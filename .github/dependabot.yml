version: 2
updates:
  # Workflow actions are pinned to full commit SHAs with a "# vX.Y.Z" comment.
  # Dependabot updates both the SHA and the version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  # vcpkg is a git submodule; this keeps its pinned commit up to date.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
