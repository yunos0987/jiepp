name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        preset: [windows-clang-ninja-debug, windows-clang-ninja-release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install LLVM/Clang
        run: choco install llvm --yes --no-progress

      - name: Install Ninja
        run: choco install ninja --yes --no-progress

      - name: Install Flex/Bison
        run: choco install winflexbison3 --yes --no-progress

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/${{ matrix.preset }}/vcpkg_installed
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      # Warnings are errors in CI only. The variable is passed here instead of
      # being set in CMakePresets.json so local preset builds are unaffected.
      # This is why the three workflow steps are run individually rather than
      # with `cmake --workflow` (a workflow preset cannot take -D options).
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [linux-makefiles-debug, linux-makefiles-release, linux-portable-release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake make flex bison curl zip unzip tar

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/${{ matrix.preset }}/vcpkg_installed
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      # Warnings are errors in CI only (see the Windows job for the rationale).
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  build-linux-sandbox:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # linux-portable-sandbox-release is the web server deployment build.
        preset: [linux-makefiles-sandbox-release, linux-portable-sandbox-release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake make flex bison curl zip unzip tar

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/${{ matrix.preset }}/vcpkg_installed
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure (sandbox)
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build (sandbox)
        run: cmake --build build/${{ matrix.preset }} --parallel

      # Ordinary tests are expected to fail in sandbox builds (filesystem-access
      # directives are intentionally disabled; see AGENTS.md), so only run the
      # sandbox-specific and robustness tests here. Two separate selections so
      # that an empty match (e.g. if the sandbox preset silently did not apply)
      # fails the job via --no-tests=error instead of reporting a false pass.
      - name: Test (sandbox-specific)
        run: ctest --test-dir build/${{ matrix.preset }} -R "^Sandbox" --no-tests=error --output-on-failure

      - name: Test (robustness)
        run: ctest --test-dir build/${{ matrix.preset }} -R "^RobustnessTest" --no-tests=error --output-on-failure
